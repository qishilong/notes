  <h1>Markdown 代码块安全预览</h1>

  <div class="note">
    <strong>核心原理：</strong>Markdown 解析器会自动将代码块内的 &lt; &gt; 转义为 &amp;lt; &amp;gt;，
    所以代码块里的 XSS 脚本会以<strong>纯文本</strong>展示，不会被执行。
    代码块外的恶意 HTML 则由 DOMPurify 清除。
  </div>

  <div class="container">

# 代码块中的 XSS 脚本应当正常显示

## 1. 围栏代码块（应原样展示代码）

```html
<script>alert('XSS')</script>
```

```javascript
// 这段代码应该能看到完整内容
document.getElementById('output').innerHTML = '<img src=x onerror=alert(1)>';
```

```html
<img src=x onerror=alert('XSS')>
<svg onload=alert('XSS')>
<a href="javascript:alert('XSS')">click me</a>
<iframe src="javascript:alert('XSS')"></iframe>
<div style="background:url(javascript:alert('XSS'))">test</div>
```

## 2. 缩进代码块（应原样展示代码）

    <script>alert('indented XSS')</script>
    <img src=x onerror="alert('indented')">

## 3. 行内代码（应原样展示代码）

<img src=x onerror="alert('indented')">

<span onclick='javascript:alert("XSS")'>window.alert('这个应该被删掉')</span>

<a href="javascript:alert('XSS')"></a>

行内代码: `<script>alert('inline XSS')</script>`

另一个: `<img src=x onerror=alert(1)>`

## 4. 代码块外的 XSS（应被过滤）

下面这些恶意标签应该被 DOMPurify 清除：

<script>alert('这个应该被删掉')</script>

<script>alert('这个应该被删掉')</script>

<img src=x onerror=alert('这个onerror应该被删掉')>

<svg onload=alert('这个应该被删掉')>

[恶意链接](javascript:alert('XSS'))

  <div class="section-title" style="margin-top: 16px;">净化后的 HTML 源码</div>
  <div id="source"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    /**
     * 核心流程：
     *
     * 1. marked.parse() 将 Markdown 转为 HTML
     *    - 代码块中的 < > 自动被转义为 &lt; &gt;（安全）
     *    - 代码块外的原始 HTML 保留不变（危险）
     *
     * 2. DOMPurify.sanitize() 净化 HTML
     *    - 代码块中的内容已经是 &lt; &gt; 文本，不会被当作标签处理（不受影响）
     *    - 代码块外的 <script>、onerror 等被移除（安全）
     *
     * 结果：代码块内容完整保留，代码块外恶意内容被清除
     */

    // DOMPurify 配置
    const purifyConfig = {
      ALLOWED_TAGS: [
        'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'br', 'hr',
        'ul', 'ol', 'li', 'blockquote', 'pre', 'code',
        'a', 'img', 'strong', 'em', 'del', 's',
        'table', 'thead', 'tbody', 'tr', 'th', 'td',
        'span', 'div', 'details', 'summary', 'input',
      ],
      ALLOWED_ATTR: [
        'href', 'src', 'alt', 'title', 'class', 'id',
        'target', 'rel', 'type', 'checked', 'disabled', 'open',
      ],
      ALLOW_DATA_ATTR: false,
      // 只允许安全的 URI 协议
      ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|tel):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i,
    };

    // Hook：外部链接安全处理
    DOMPurify.addHook('afterSanitizeAttributes', (node) => {
      if (node.tagName === 'A') {
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      }
    });

    function render() {
      const markdown = document.getElementById('editor').value;

      // 第一步：Markdown → HTML（代码块自动转义）
      const rawHtml = marked.parse(markdown);

      // 第二步：DOMPurify 净化（代码块内容不受影响）
      const cleanHtml = DOMPurify.sanitize(rawHtml, purifyConfig);

      // 第三步：渲染
      document.getElementById('preview').innerHTML = rawHtml;
      document.getElementById('source').textContent = rawHtml;
    }

    // 实时预览
    document.getElementById('editor').addEventListener('input', render);
    render();
  </script>
</body>
